<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#c6a15a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VCB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>VCB Management</title>
    <style>
      html, body, #root { min-height: 100dvh; margin: 0; background: #f7f7fb; }
      html.dark, html.dark body, html.dark #root { background: #09090b; }
    </style>
    <script>
      (function () {
        try {
          if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            for (var i = 0; i < regs.length; i++) regs[i].unregister()
          })
        }
      })()
    </script>
  </head>
  <body>
    <div class="status-bar-sampler" aria-hidden="true"></div>
    <div id="root">
      <div style="min-height:100dvh;display:flex;align-items:center;justify-center;font-family:system-ui,sans-serif;color:#52525b;font-size:15px;">
        Đang tải ứng dụng…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
