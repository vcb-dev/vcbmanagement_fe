<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VCB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>VCB Management</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#52525b;font-size:15px;">
        Đang tải ứng dụng…
      </div>
    </div>
    <script>
      (function () {
        function wipe() {
          var jobs = []
          if ('serviceWorker' in navigator) {
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (reg) { return reg.unregister() }))
              }),
            )
          }
          if (window.caches) {
            jobs.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) { return caches.delete(key) }))
              }),
            )
          }
          return Promise.all(jobs)
        }
        wipe()
        setTimeout(function () {
          var root = document.getElementById('root')
          if (!root || (root.textContent || '').indexOf('Đang tải ứng dụng') === -1) return
          wipe().then(function () {
            if (sessionStorage.getItem('vcb-sw-cleared') === '1') {
              root.innerHTML =
                '<div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:system-ui,sans-serif;padding:24px;text-align:center;color:#18181b">' +
                '<p style="font-size:18px;font-weight:600;margin:0">Không tải được trang</p>' +
                '<p style="font-size:14px;color:#52525b;margin:0">Vào Cài đặt → Safari → Xóa dữ liệu website, rồi mở lại link.</p>' +
                '<button style="font-size:16px;padding:10px 16px;border:0;border-radius:10px;background:#4f46e5;color:#fff" onclick="location.reload()">Tải lại</button>' +
                '</div>'
              return
            }
            sessionStorage.setItem('vcb-sw-cleared', '1')
            location.reload()
          })
        }, 2500)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
